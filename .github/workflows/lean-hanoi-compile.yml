name: Lean Hanoi Compile

on:
  push:
    branches:
      - tmp/lean-hanoi-compile-20260711
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          use-mathlib-cache: false
          lake-package-directory: lean-hanoi-ci
      - name: Fetch Mathlib dependencies
        working-directory: lean-hanoi-ci
        run: |
          lake update
          lake exe cache get
      - name: Compile improved Hanoi file
        working-directory: lean-hanoi-ci
        run: lake env lean TowerOfHanoiImproved.lean
